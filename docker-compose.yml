services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: exampledb
      POSTGRES_PASSWORD: exampledb
      POSTGRES_DB: exampledb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exampledb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=exampledb;Username=exampledb;Password=exampledb"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Idle toolchain container (SDK, restored packages, source) that the
  # reviewer's verification checks exec into for tests and lint.
  tests:
    build:
      context: .
      target: test

volumes:
  postgres_data:
